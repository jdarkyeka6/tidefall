<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tidefall Castle — Floors 1–3</title>
<style>
  :root{ --sea:#0b1f2a; --parchment:#efe6d2; --parchment-dim:#c7bfa9; --bronze:#d9a441;
    --line:rgba(217,164,65,.35); --panel:rgba(8,22,30,.82); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#06141c; }
  canvas{ display:block; }
  body{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; color:var(--parchment); }
  #overlay{ position:fixed; inset:0; z-index:30; display:grid; place-items:center;
    background:radial-gradient(120% 90% at 50% 35%, rgba(16,48,63,.55), rgba(6,20,28,.96)); backdrop-filter:blur(2px); }
  .card{ width:min(560px,92vw); padding:34px 36px; text-align:center; background:var(--panel);
    border:1px solid var(--line); border-radius:18px; box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .crest{ font-size:13px; letter-spacing:.42em; color:var(--bronze); text-transform:uppercase; }
  .card h1{ font-size:40px; letter-spacing:.02em; margin:10px 0 4px; font-weight:600; }
  .card .sub{ color:var(--parchment-dim); font-size:15px; margin-bottom:22px; }
  .keys{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
  .keys span{ font-family:ui-monospace,monospace; font-size:12px; color:var(--parchment);
    background:rgba(217,164,65,.12); border:1px solid var(--line); padding:6px 10px; border-radius:8px; }
  #startBtn{ font:inherit; font-size:17px; letter-spacing:.08em; cursor:pointer; color:#1a1206;
    background:linear-gradient(180deg,#f0c061,#d9a441); border:none; padding:13px 34px; border-radius:11px;
    text-transform:uppercase; box-shadow:0 8px 24px rgba(217,164,65,.3); transition:transform .12s ease; }
  #startBtn:hover{ transform:translateY(-2px); } #startBtn:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
  #hud{ position:fixed; inset:0; z-index:10; pointer-events:none; }
  #title{ position:absolute; top:18px; left:20px; }
  #title .name{ font-size:20px; letter-spacing:.04em; }
  #title .floor{ font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--bronze); }
  #room{ position:absolute; left:50%; bottom:30px; transform:translateX(-50%); font-size:15px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--parchment); text-shadow:0 2px 10px rgba(0,0,0,.8); background:var(--panel);
    border:1px solid var(--line); padding:8px 18px; border-radius:30px; opacity:0; transition:opacity .35s ease; }
  #help{ position:absolute; left:20px; bottom:22px; font-size:12px; line-height:1.7; color:var(--parchment-dim);
    background:var(--panel); border:1px solid var(--line); padding:10px 14px; border-radius:12px; max-width:248px; }
  #help b{ color:var(--parchment); }
  #toast{ position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); font-size:15px; color:var(--parchment);
    background:var(--panel); border:1px solid var(--line); padding:12px 20px; border-radius:12px; opacity:0;
    transition:opacity .3s ease; text-align:center; max-width:380px; }
  #cross{ position:absolute; left:50%; top:50%; width:8px; height:8px; transform:translate(-50%,-50%);
    border:1.5px solid rgba(239,230,210,.7); border-radius:50%; }
  #mapWrap{ position:absolute; top:16px; right:16px; width:200px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:8px; pointer-events:none; }
  #mapWrap .cap{ font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--bronze); text-align:center; margin-bottom:4px; }
  #map{ width:100%; height:164px; border-radius:8px; display:block; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
  <div id="hud" class="hidden">
    <div id="title"><div class="name">Tidefall Castle</div><div class="floor" id="floorLabel">Floor 1 · Ground</div></div>
    <div id="cross"></div><div id="room"></div><div id="toast"></div>
    <div id="mapWrap"><div class="cap" id="mapCap">Floor 1</div><canvas id="map" width="184" height="164"></canvas></div>
    <div id="help"><b>WASD</b> move · <b>Mouse</b> look<br/><b>Shift</b> sprint · <b>Space</b> jump<br/>
      <b>Stairs</b> climb the courtyard edges · <b>M</b> map · <b>Esc</b> release</div>
  </div>
  <div id="overlay"><div class="card">
    <div class="crest">Tidefall Academy</div><h1>Tidefall Castle</h1>
    <div class="sub">Floors 1–3 · ground · academic · magic labs — climb the keep</div>
    <div class="keys"><span>WASD move</span><span>Mouse look</span><span>Shift sprint</span><span>Space jump</span><span>M map</span></div>
    <button id="startBtn">Enter the Castle</button>
  </div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

/* +X=East -X=West  +Z=South(road)  -Z=North(sea) */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc2d4); scene.fog=new THREE.Fog(0x9fc2d4,80,560);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbcd6e6,0x4a4334,0.85));
const sun=new THREE.DirectionalLight(0xffe7c2,1.5); sun.position.set(-130,210,100); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera; sc.left=-180;sc.right=180;sc.top=180;sc.bottom=-180;sc.near=1;sc.far=620; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(new THREE.AmbientLight(0x405060,0.38));

/* ---------- textures ---------- */
function tex(draw,rep=1){ const c=document.createElement('canvas'); c.width=c.height=256; draw(c.getContext('2d'),256);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep); t.anisotropy=4; return t; }
const stoneTex=tex((g,s)=>{ g.fillStyle="#8d8474"; g.fillRect(0,0,s,s);
  for(let i=0;i<2600;i++){const v=Math.random()*40-20; g.fillStyle=`rgba(${110+v},${104+v},${92+v},.5)`; g.fillRect(Math.random()*s,Math.random()*s,2,2);}
  g.strokeStyle="rgba(60,55,48,.5)"; g.lineWidth=2;
  for(let y=0;y<s;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(s,y);g.stroke(); const off=(y/32)%2?16:0;
    for(let x=off;x<s;x+=64){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+32);g.stroke();}}},3);
const floorTex=tex((g,s)=>{ g.fillStyle="#6f6a60"; g.fillRect(0,0,s,s); g.strokeStyle="rgba(40,38,34,.55)"; g.lineWidth=3;
  for(let i=0;i<=s;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,s);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(s,i);g.stroke();}
  for(let i=0;i<1800;i++){const v=Math.random()*30-15; g.fillStyle=`rgba(${120+v},${114+v},${104+v},.4)`; g.fillRect(Math.random()*s,Math.random()*s,2,2);}});
const cobbleTex=tex((g,s)=>{ g.fillStyle="#7c7468"; g.fillRect(0,0,s,s);
  for(let y=8;y<s;y+=22)for(let x=8;x<s;x+=22){const r=8+Math.random()*2,v=Math.random()*30-15;
    g.beginPath();g.arc(x+(y/22%2?11:0),y,r,0,7);g.fillStyle=`rgb(${130+v},${122+v},${108+v})`;g.fill();g.strokeStyle="rgba(50,46,40,.6)";g.lineWidth=1.5;g.stroke();}},6);
const grassTex=tex((g,s)=>{ g.fillStyle="#5c7a3f"; g.fillRect(0,0,s,s);
  for(let i=0;i<6000;i++){const v=Math.random()*50-25; g.fillStyle=`rgb(${78+v},${110+v},${56+v})`; g.fillRect(Math.random()*s,Math.random()*s,2,3);}},24);
const woodTex=tex((g,s)=>{ g.fillStyle="#6e4a2a"; g.fillRect(0,0,s,s);
  for(let i=0;i<40;i++){g.strokeStyle=`rgba(${60+Math.random()*40},${38+Math.random()*30},20,.5)`;g.lineWidth=1+Math.random()*2;
    g.beginPath();const y=Math.random()*s;g.moveTo(0,y);g.bezierCurveTo(s/3,y+8,2*s/3,y-8,s,y);g.stroke();}},2);
const M={ stone:new THREE.MeshStandardMaterial({map:stoneTex,roughness:.95}),
  floor:new THREE.MeshStandardMaterial({map:floorTex,roughness:.96}),
  floor2:new THREE.MeshStandardMaterial({map:floorTex,roughness:.96,color:0xb9b2a4}),
  cobble:new THREE.MeshStandardMaterial({map:cobbleTex,roughness:.98}),
  grass:new THREE.MeshStandardMaterial({map:grassTex,roughness:1}),
  wood:new THREE.MeshStandardMaterial({map:woodTex,roughness:.85}),
  roofN:new THREE.MeshStandardMaterial({color:0x3b3a63,roughness:.7}),
  roofA:new THREE.MeshStandardMaterial({color:0xb9912f,roughness:.6}),
  roofC:new THREE.MeshStandardMaterial({color:0x3f7d4e,roughness:.7}),
  roofB:new THREE.MeshStandardMaterial({color:0xa6442b,roughness:.7}),
  water:new THREE.MeshStandardMaterial({color:0x2f7fa6,roughness:.25,metalness:.2,transparent:true,opacity:.85}),
  trim:new THREE.MeshStandardMaterial({color:0x4b4438,roughness:.8}),
  red:new THREE.MeshStandardMaterial({color:0x8a2f2f,roughness:.8}),
  rail:new THREE.MeshStandardMaterial({color:0x6e5a3a,roughness:.7}),
  rune:new THREE.MeshStandardMaterial({color:0x3aa0c8,emissive:0x1b6f8c,emissiveIntensity:.6,roughness:.5}) };

const world=new THREE.Group(); scene.add(world);
const colliders=[];
const floorRects=[];
const ramps=[];
const torches=[];

function box(cx,cz,w,d,h,y,mat,collide=true,cast=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(cx,y+h/2,cz); m.castShadow=cast; m.receiveShadow=true; world.add(m);
  if(collide) colliders.push({minX:cx-w/2,maxX:cx+w/2,minZ:cz-d/2,maxZ:cz+d/2,yMin:y,yMax:y+h});
  return m;
}
function wall(x1,z1,x2,z2,h,y,t=1.2,door=null){
  const horiz=Math.abs(x2-x1)>Math.abs(z2-z1); const cx=(x1+x2)/2,cz=(z1+z2)/2;
  if(!door){ if(horiz)box(cx,cz,Math.abs(x2-x1),t,h,y,M.stone); else box(cx,cz,t,Math.abs(z2-z1),h,y,M.stone); return; }
  const a=horiz?x1:z1,b=horiz?x2:z2; const lo=Math.min(a,b),hi=Math.max(a,b); const ds=door.at-door.w/2,de=door.at+door.w/2;
  const seg=(s,e)=>{ if(e-s<0.3)return; const c=(s+e)/2,l=e-s; if(horiz)box(c,cz,l,t,h,y,M.stone); else box(cx,c,t,l,h,y,M.stone); };
  seg(lo,ds); seg(de,hi);
  if(horiz)box(door.at,cz,door.w,t,1.2,y+h-1.2,M.stone,false); else box(cx,door.at,t,door.w,1.2,y+h-1.2,M.stone,false);
}
function slab(x1,z1,x2,z2,y,mat=M.floor2){
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1),0.6,Math.abs(z2-z1)),mat);
  m.position.set((x1+x2)/2,y-0.3,(z1+z2)/2); m.receiveShadow=true; m.castShadow=true; world.add(m);
  floorRects.push({x1:Math.min(x1,x2),x2:Math.max(x1,x2),z1:Math.min(z1,z2),z2:Math.max(z1,z2),y});
}
function label(text,x,z,y,col="#efe6d2",size=42){
  const c=document.createElement('canvas'); c.width=512;c.height=128; const g=c.getContext('2d');
  g.font=`600 ${size}px Georgia, serif`; g.textAlign="center"; g.textBaseline="middle";
  g.shadowColor="rgba(0,0,0,.9)"; g.shadowBlur=12; g.fillStyle=col; g.fillText(text,256,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  sp.position.set(x,y,z); sp.scale.set(13,3.25,1); world.add(sp);
}
function torch(x,z,y=0){ box(x,z,0.4,0.4,2.6,y,M.trim,false);
  const flame=new THREE.Mesh(new THREE.SphereGeometry(0.34,8,8),new THREE.MeshBasicMaterial({color:0xffb347}));
  flame.position.set(x,y+2.9,z); world.add(flame);
  const l=new THREE.PointLight(0xffb060,1.4,22,2); l.position.set(x,y+3,z); world.add(l); torches.push({l,flame,base:1.4}); }

/* ---------- constants ---------- */
const IN=52, WH=7, OW=21, CWH=6.4, BW=4;
const CY={x1:-22,x2:22,z1:-20,z2:24};
const FY=lvl=>(lvl-1)*7;
const rooms=[];
const reg=(name,x1,z1,x2,z2,cat,floor)=>rooms.push({name,x1,z1,x2,z2,cat,floor});

/* ---------- terrain ---------- */
const ground=new THREE.Mesh(new THREE.CircleGeometry(250,64),M.grass);
ground.rotation.x=-Math.PI/2; ground.position.y=-0.02; ground.receiveShadow=true; world.add(ground);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(1000,440),new THREE.MeshStandardMaterial({color:0x1f6f96,roughness:.3,metalness:.25}));
sea.rotation.x=-Math.PI/2; sea.position.set(0,-1.2,-380); world.add(sea);
const baseSlab=new THREE.Mesh(new THREE.BoxGeometry((IN+8)*2,1,(IN+8)*2),M.floor);
baseSlab.position.y=0; baseSlab.receiveShadow=true; world.add(baseSlab);
floorRects.push({x1:-IN-8,x2:IN+8,z1:-IN-8,z2:IN+8,y:0});
const court=new THREE.Mesh(new THREE.PlaneGeometry(CY.x2-CY.x1,CY.z2-CY.z1),M.cobble);
court.rotation.x=-Math.PI/2; court.position.set((CY.x1+CY.x2)/2,0.51,(CY.z1+CY.z2)/2); court.receiveShadow=true; world.add(court);
[[-12,-8],[12,-8],[-12,14],[12,14]].forEach(([gx,gz])=>{ const p=new THREE.Mesh(new THREE.CircleGeometry(5,24),M.grass);
  p.rotation.x=-Math.PI/2; p.position.set(gx,0.52,gz); p.receiveShadow=true; world.add(p); });

/* ---------- outer curtain ---------- */
function curtain(x1,z1,x2,z2,gate=null){ wall(x1,z1,x2,z2,OW,0,1.6,gate);
  const horiz=Math.abs(x2-x1)>Math.abs(z2-z1); const len=horiz?Math.abs(x2-x1):Math.abs(z2-z1); const n=Math.floor(len/4);
  for(let i=0;i<=n;i++){const f=i/n; box(x1+(x2-x1)*f,z1+(z2-z1)*f,1.4,1.4,1.4,OW,M.stone,false);} }
curtain(-IN,-IN,IN,-IN); curtain(-IN,IN,IN,IN,{at:0,w:9}); curtain(-IN,-IN,-IN,IN); curtain(IN,-IN,IN,IN);

/* ====================================================================
   COURTYARD STAIRCASES — stacked flights up the open courtyard edges
   ==================================================================== */
const flightW=3.6;
function buildFlight(side, base){
  const y0=FY(base), y1=FY(base+1);
  let r;
  if(side==='W') r={x1:-22,x2:-22+flightW, z1:1,z2:17, axis:'z', lo:17, hi:1, railFixed:-22+flightW, railHoriz:true};
  if(side==='E') r={x1:22-flightW,x2:22, z1:-17,z2:-1, axis:'z', lo:-17, hi:-1, railFixed:22-flightW, railHoriz:true};
  if(side==='N') r={x1:1,x2:17, z1:-20,z2:-20+flightW, axis:'x', lo:17, hi:1, railFixed:-20+flightW, railHoriz:false};
  if(side==='S') r={x1:-17,x2:-1, z1:24-flightW,z2:24, axis:'x', lo:-17, hi:-1, railFixed:24-flightW, railHoriz:false};
  ramps.push({x1:r.x1,x2:r.x2,z1:r.z1,z2:r.z2,axis:r.axis,lo:r.lo,hi:r.hi,from:y0,to:y1});
  const steps=12;
  for(let i=0;i<steps;i++){ const f=i/(steps-1); const y=y0+(y1-y0)*f; const c=r.lo+(r.hi-r.lo)*f;
    if(r.axis==='z') box((r.x1+r.x2)/2, c, flightW, 1.4, 0.6, y, M.stone, false);
    else             box(c, (r.z1+r.z2)/2, 1.4, flightW, 0.6, y, M.stone, false); }
  if(r.railHoriz) box(r.railFixed,(r.z1+r.z2)/2,0.4,Math.abs(r.z2-r.z1),9,y0,M.rail);
  else            box((r.x1+r.x2)/2,r.railFixed,Math.abs(r.x2-r.x1),0.4,9,y0,M.rail);
  label(`Stair ${side}`, (r.x1+r.x2)/2, y0+1.5, (r.z1+r.z2)/2, "#d9a441", 22);
}
buildFlight('W',1); buildFlight('E',1);
buildFlight('N',2); buildFlight('S',2);

const floorGaps={ 2:{W:[1],E:[-1],N:[17],S:[-17]}, 3:{N:[1],S:[-1]} };
function railLine(horiz,fixed,a,b,y,gaps){ const Wg=5; const sorted=[...gaps].sort((p,q)=>p-q);
  const lo=Math.min(a,b),hi=Math.max(a,b); const segs=[]; let cur=lo;
  for(const gc of sorted){ const gs=gc-Wg/2,ge=gc+Wg/2; if(gs>cur)segs.push([cur,gs]); cur=Math.max(cur,ge); }
  if(cur<hi)segs.push([cur,hi]);
  for(const seg of segs){ const s=seg[0],e=seg[1]; if(e-s<0.3)continue; const c=(s+e)/2,l=e-s;
    if(horiz)box(c,fixed,l,0.4,1.2,y,M.rail); else box(fixed,c,0.4,l,1.2,y,M.rail); } }
function railRing(level){ const y=FY(level); const g=floorGaps[level]||{};
  railLine(false,CY.x1,CY.z1,CY.z2,y,g.W||[]); railLine(false,CY.x2,CY.z1,CY.z2,y,g.E||[]);
  railLine(true,CY.z1,CY.x1,CY.x2,y,g.N||[]);   railLine(true,CY.z2,CY.x1,CY.x2,y,g.S||[]); }

/* ====================================================================
   FLOOR 1 — Ground
   ==================================================================== */
wall(CY.x1,CY.z2,CY.x2,CY.z2,CWH,0,1.2,{at:0,w:7});
wall(CY.x1,CY.z1,-2,CY.z1,CWH,0,1.2,{at:-12,w:5}); wall(-2,CY.z1,CY.x2,CY.z1,CWH,0,1.2,{at:11,w:5});
wall(CY.x1,CY.z1,CY.x1,2,CWH,0,1.2,{at:-9,w:5}); wall(CY.x1,2,CY.x1,CY.z2,CWH,0,1.2,{at:18,w:5});
wall(CY.x2,CY.z1,CY.x2,CY.z2,CWH,0,1.2,{at:14,w:5});
reg("Founders' Courtyard",CY.x1,CY.z1,CY.x2,CY.z2,"public",1);
const fb=new THREE.Mesh(new THREE.CylinderGeometry(4,4.4,1,28),M.stone); fb.position.set(0,1,2); fb.castShadow=true; world.add(fb);
colliders.push({circle:true,x:0,z:2,r:4.4,yMin:0,yMax:1.5});
const fw=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,0.4,28),M.water); fw.position.set(0,1.2,2); world.add(fw);
const ped=new THREE.Mesh(new THREE.CylinderGeometry(1,1.3,2.4,12),M.stone); ped.position.set(0,2.2,2); ped.castShadow=true; world.add(ped);
const statue=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.7,2.6,10),M.trim); statue.position.set(0,4.5,2); statue.castShadow=true; world.add(statue);
const sHead=new THREE.Mesh(new THREE.SphereGeometry(0.55,12,12),M.trim); sHead.position.set(0,5.9,2); world.add(sHead);
label("Founders' Courtyard",0,7.6,8,"#f0e4c4",34);

reg("Great Hall",-44,-52,-2,CY.z1,"public",1);
wall(-44,-52,-2,-52,WH,0); wall(-44,-52,-44,CY.z1,WH,0); wall(-2,-52,-2,CY.z1,WH,0,1.2,{at:-36,w:5});
for(let r=0;r<6;r++)for(let s=-1;s<=1;s+=2)box(-23+s*9,-46+r*4,7,0.8,0.9,0,M.wood,false);
box(-23,-50,16,3,0.6,0,M.red,false); label("Great Hall",-23,5.4,-36,"#f0e4c4",38); torch(-43,-22); torch(-3,-50);
reg("Dining Hall",-2,-52,28,CY.z1,"public",1);
wall(-2,-52,28,-52,WH,0); wall(28,-52,28,CY.z1,WH,0,1.2,{at:-36,w:4});
for(let r=0;r<3;r++)for(let c=0;c<3;c++)box(2+c*9,-46+r*9,6,2.4,1,0,M.wood,false);
label("Dining Hall",13,5.4,-36,"#f0e4c4",34); torch(-1,-50); torch(27,-22);
reg("Kitchens",28,-52,44,CY.z1,"service",1);
wall(28,-52,44,-52,WH,0); wall(44,-52,44,CY.z1,WH,0);
box(31,-48,4,3,1.4,0,M.trim,false); box(36,-30,10,2,1,0,M.wood,false); label("Kitchens",36,5.2,-34,"#e9d8c0",28); torch(30,-22);

function tower(x,z,roofMat,name,banner){ const r=10,h=28;
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r+1.2,h,24),M.stone); body.position.set(x,h/2,z); body.castShadow=true; world.add(body);
  colliders.push({circle:true,x,z,r:r+0.4,yMin:0,yMax:h});
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2; box(x+Math.cos(a)*r,z+Math.sin(a)*r,1.5,1.5,1.6,h,M.stone,false);}
  const roof=new THREE.Mesh(new THREE.ConeGeometry(r+2,11,24),roofMat); roof.position.set(x,h+5.5,z); roof.castShadow=true; world.add(roof);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,5,6),M.trim); pole.position.set(x,h+12,z); world.add(pole);
  const flag=new THREE.Mesh(new THREE.PlaneGeometry(4,2.4),new THREE.MeshStandardMaterial({color:banner,side:THREE.DoubleSide})); flag.position.set(x+2.2,h+13,z); world.add(flag);
  label(name,x,h+16,z,"#f0e4c4",30); }

/* ====================================================================
   PLAYER
   ==================================================================== */
const EYE=1.7,RAD=0.6,STEP=1.7;
const controls=new PointerLockControls(camera,renderer.domElement);
controls.getObject().position.set(0,EYE,44); camera.rotation.y=Math.PI; scene.add(controls.getObject());
const overlay=document.getElementById('overlay'),hud=document.getElementById('hud'),startBtn=document.getElementById('startBtn');
const roomEl=document.getElementById('room'),toastEl=document.getElementById('toast');
const mapWrap=document.getElementById('mapWrap'),mapCv=document.getElementById('map'),mg=mapCv.getContext('2d');
const floorLabel=document.getElementById('floorLabel'),mapCap=document.getElementById('mapCap');
function start(){ controls.lock(); }
startBtn.addEventListener('click',start);
addEventListener('keydown',e=>{ if(e.code==='Enter'&&overlay.style.display!=='none')start(); });
controls.addEventListener('lock',()=>{ overlay.style.display='none'; hud.classList.remove('hidden'); });
controls.addEventListener('unlock',()=>{ overlay.style.display='grid'; });
const keys={}; addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='KeyM')mapWrap.classList.toggle('hidden'); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
let vy=0,onGround=true; const vel=new THREE.Vector3(),fwd=new THREE.Vector3(),right=new THREE.Vector3();
function rampHeight(r,x,z){ const c=r.axis==='x'?x:z; const f=Math.max(0,Math.min(1,(c-r.lo)/(r.hi-r.lo))); return r.from+(r.to-r.from)*f; }
function groundHeightAt(x,z,feet){ let best=-Infinity; const consider=h=>{ if(h<=feet+STEP&&h>best)best=h; };
  for(const r of ramps){ if(x>=r.x1&&x<=r.x2&&z>=r.z1&&z<=r.z2)consider(rampHeight(r,x,z)); }
  for(const f of floorRects){ if(x>=f.x1&&x<=f.x2&&z>=f.z1&&z<=f.z2)consider(f.y); }
  return best===-Infinity?0:best; }
function collide(pos){ const feet=pos.y-EYE,head=pos.y;
  for(const c of colliders){ if(c.yMin>head||c.yMax<feet)continue;
    if(c.circle){ const dx=pos.x-c.x,dz=pos.z-c.z,d=Math.hypot(dx,dz);
      if(d<c.r+RAD){const p=c.r+RAD-d; pos.x+=dx/(d||1)*p; pos.z+=dz/(d||1)*p;} }
    else{ const cx=Math.max(c.minX,Math.min(pos.x,c.maxX)),cz=Math.max(c.minZ,Math.min(pos.z,c.maxZ));
      const dx=pos.x-cx,dz=pos.z-cz,d=Math.hypot(dx,dz);
      if(d<RAD){ if(d>0.0001){const p=RAD-d; pos.x+=dx/d*p; pos.z+=dz/d*p;}
        else{ const tR=c.maxX-pos.x,tL=pos.x-c.minX,tU=c.maxZ-pos.z,tD=pos.z-c.minZ,mn=Math.min(tR,tL,tU,tD);
          if(mn===tR)pos.x=c.maxX+RAD; else if(mn===tL)pos.x=c.minX-RAD; else if(mn===tU)pos.z=c.maxZ+RAD; else pos.z=c.minZ-RAD; } } } }
}
function currentFloor(p){ if(p.y>FY(3)-2)return 3; if(p.y>FY(2)-2)return 2; return 1; }
function currentRoom(p){ const fl=currentFloor(p);
  for(const r of rooms){ if(r.floor===fl&&p.x>=r.x1&&p.x<=r.x2&&p.z>=r.z1&&p.z<=r.z2)return r; }
  const T=[["Nocten Wing",-IN,-IN],["Astrae Wing",IN,-IN],["Calyx Wing",-IN,IN],["Brannor Wing",IN,IN]];
  for(const t of T){ if(Math.hypot(p.x-t[1],p.z-t[2])<11)return {name:t[0]}; }
  if(p.z>54&&fl===1)return {name:"Castle Approach"}; return null; }
let lastRoom=""; function setRoom(n){ if(n===lastRoom)return; lastRoom=n; if(n){roomEl.textContent=n; roomEl.style.opacity=1;} else roomEl.style.opacity=0; }
function toast(m){ toastEl.textContent=m; toastEl.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.style.opacity=0,2600); }
const fname={1:"Floor 1 · Ground",2:"Floor 2 · Academic",3:"Floor 3 · Magic Labs"};
const fhint={2:"Floor 2 — the academic level. The walkway rings the courtyard; the N & S stairs climb to the labs.",3:"Floor 3 — the magic labs. The round room north is Prof. Hale's dueling classroom."};
const catCol={public:"#caa15a",academic:"#5b7fb0",service:"#9a6fae",faculty:"#5e9d70",circulation:"#b9a06a",magic:"#3f8f7a",practice:"#9a6fae",library:"#a98f55"};
function drawMap(p){ const fl=currentFloor(p); const W=mapCv.width,H=mapCv.height; mg.clearRect(0,0,W,H);
  const scl=W/((IN+14)*2); const tx=x=>W/2+x*scl,tz=z=>H/2+z*scl;
  mg.fillStyle="rgba(20,40,52,.7)"; mg.fillRect(0,0,W,H);
  for(const r of rooms){ if(r.floor!==fl)continue; mg.fillStyle=catCol[r.cat]||"#888"; mg.globalAlpha=.55;
    mg.fillRect(tx(r.x1),tz(r.z1),(r.x2-r.x1)*scl,(r.z2-r.z1)*scl); mg.globalAlpha=1;
    mg.strokeStyle="rgba(0,0,0,.4)"; mg.strokeRect(tx(r.x1),tz(r.z1),(r.x2-r.x1)*scl,(r.z2-r.z1)*scl); }
  const T=[[-IN,-IN,"#4a489a"],[IN,-IN,"#d9b13a"],[-IN,IN,"#46a05c"],[IN,IN,"#c6552f"]];
  for(const t of T){ mg.fillStyle=t[2]; mg.beginPath(); mg.arc(tx(t[0]),tz(t[1]),10*scl,0,7); mg.fill(); }
  mg.strokeStyle="#d9a441"; mg.lineWidth=1.5; mg.strokeRect(tx(-IN),tz(-IN),IN*2*scl,IN*2*scl);
  mg.save(); mg.translate(tx(p.x),tz(p.z)); mg.rotate(-camera.rotation.y);
  mg.fillStyle="#fff"; mg.beginPath(); mg.moveTo(0,-5); mg.lineTo(3.5,4); mg.lineTo(-3.5,4); mg.closePath(); mg.fill(); mg.restore(); }

const clock=new THREE.Clock(); let shownFloor=1; const hinted={};
function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05);
  if(controls.isLocked){
    const speed=(keys['ShiftLeft']||keys['ShiftRight'])?11:6;
    camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); right.crossVectors(fwd,camera.up).normalize();
    vel.set(0,0,0);
    if(keys['KeyW'])vel.add(fwd); if(keys['KeyS'])vel.sub(fwd); if(keys['KeyD'])vel.add(right); if(keys['KeyA'])vel.sub(right);
    if(vel.lengthSq()>0)vel.normalize().multiplyScalar(speed*dt);
    const pos=controls.getObject().position; pos.x+=vel.x; pos.z+=vel.z; collide(pos);
    const gh=groundHeightAt(pos.x,pos.z,pos.y-EYE);
    if(keys['Space']&&onGround){ vy=7.8; onGround=false; }
    vy-=22*dt; pos.y+=vy*dt;
    if(pos.y<gh+EYE){ pos.y=gh+EYE; vy=0; onGround=true; } else onGround=false;
    const r=currentRoom(pos); setRoom(r?r.name:"");
    const fl=currentFloor(pos);
    if(fl!==shownFloor){ shownFloor=fl; floorLabel.textContent=fname[fl]; mapCap.textContent="Floor "+fl;
      if(fhint[fl]&&!hinted[fl]){ toast(fhint[fl]); hinted[fl]=true; } }
    drawMap(pos);
  }
  const t=clock.elapsedTime;
  for(const o of torches){ const f=0.7+Math.sin(t*12+o.l.position.x)*0.18+Math.random()*0.12; o.l.intensity=o.base*f; o.flame.scale.setScalar(0.9+f*0.25); }
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
