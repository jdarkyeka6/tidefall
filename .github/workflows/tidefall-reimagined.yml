name: Tidefall Reimagined
on:
  push:
    paths:
      - 'reimagined/**'
      - '.github/workflows/tidefall-reimagined.yml'
  pull_request:
    paths:
      - 'reimagined/**'
      - '.github/workflows/tidefall-reimagined.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reimagined
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify output assets
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
